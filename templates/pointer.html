<title>hammerola</title>
<!-- A browser handed this link stops asking for /favicon.ico, which is what
     keeps two 404s out of the log on every single page load. -->
<link rel="icon" type="image/svg+xml" href="/_v/favicon.svg">
<link rel="stylesheet" href="/_v/site.css">
</head><body>
<!-- /project/<pid>/ — the URL that names no pointer, and therefore the only one
     allowed to apply the reader's remembered choice (SPEC 9). It used to be a
     302 to `latest` on the server, and it cannot stay one: the choice lives in
     localStorage, which only the browser can read.

     This page is deliberately tiny and pulls NONE of the viewer: its whole job
     is to read one key and leave. Everything it shows lives in the header —
     and that header is a COPY, not something borrowed. It reads as borrowed
     because site.css used to dress all three pages, but build.html and
     index.html have both dropped it: they are drawn by the React bundle, which
     carries its own styling inline. This page cannot load that bundle, so
     site.css now describes exactly one page, this one, and every value in it is
     a copy of an interface value with nothing but a test holding the two
     together (ui/tests/chrome.test.js, which imports what the interface
     actually uses and compares it against this file and that one).

     The link colour is part of the copy too, and it is one of the two values in
     it that NOTHING CHECKS. #1f6fd0 is the site's accent blue, with five copies
     inside the bundle (HammerolaEntry.jsx and HammerolaViewer.jsx), and this
     page takes exactly it -- so moving the accent there leaves the resolver on
     the old blue silently, which is the class of failure the four imported
     constants exist to prevent. It is a known gap, not a checked value:
     ui/src/style.jsx says what promoting it would cost, and site.css lists it
     beside the other unchecked one. (The interface's header does have a link,
     `all projects` in HammerolaViewer.jsx -- it just inherits its colour, which
     is why there is no constant to compare against rather than no link.)

     What the colour has to satisfy regardless is the half of "still works with
     no script" that is easy to ship broken: a visited link has to stay readable
     on the background under it, which is now the interface's #eceef1 and was,
     for as long as this page carried the old dark chrome, #1e1e1e.

     The link is not decoration. It is what is left when the script does not
     run, and a reader who lands on a page with no way forward is worse off than
     the redirect ever left them. -->
<!-- The header is the INTERFACE'S header, mark and all, and that is the point
     rather than decoration: this page is on the way to that interface and is
     visible for as long as the redirect takes, which on the remembered-`dev`
     path is a builds.json round trip. Drawn as anything else, it reads as a
     different program appearing for an instant inside this one. The mark is
     inline SVG copied from ui/src/style.jsx -- a file, or the bundle, would be
     a second request on the one page whose whole job is to leave quickly.

     BOTH OF THOSE ARE COPIES OF A THIRD THING, brand/mark-on-light.svg, which
     is the drawing the designer sent; ui/tests/chrome.test.js holds all three
     to each other, element for element. So this is transcribed from the file
     and not eyeballed from the component, and the inks are the light-page pair
     because this page is light like the rest of the interface.

     THE INK IS WRITTEN OUT AND THE THEME IS NOT CONSULTED. There is a second
     ink for a dark background (brand/mark-on-dark.svg) and this page will need
     it when issue #35 lands, but it cannot pick between them today: it
     reads no localStorage, runs no bundle, and its whole point is to be gone
     before a script could repaint anything. Whatever answers that for
     site.css's palette has to answer it here in the same commit -- issue #35
     names this page for exactly that reason. -->
<div id="bar"><span class="mark">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="11" y="5" width="9" height="38" fill="#1c1f23"/>
      <path d="M20 23.5h8a8.5 8.5 0 018.5 8.5v11" fill="none" stroke="#1c1f23" stroke-width="6.5"/>
      <circle cx="15.5" cy="12" r="1.9" fill="#fff"/>
      <circle cx="15.5" cy="20" r="1.9" fill="#fff"/>
      <circle cx="15.5" cy="28" r="1.9" fill="#fff"/>
      <circle cx="15.5" cy="36" r="1.9" fill="#fff"/>
    </svg><b>hammerola</b></span>
  <span class="meta">opening the build you were last on&hellip;</span>
  <span class="spacer"></span>
  <a href="latest/">Open the latest build</a>
</div>
