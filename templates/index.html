<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>hammerola</title>
<!-- A browser handed this link stops asking for /favicon.ico, which is what
     keeps two 404s out of the log on every single page load. -->
<link rel="icon" type="image/svg+xml" href="/_v/favicon.svg">
<!-- No stylesheet link, and that is the second page to lose one. This page used
     to be drawn by a script of its own (static/_v/index.js) over the chrome in
     site.css -- #bar, #grid, .card, #err -- and both are gone: the interface
     draws the header, the cards and the error box itself, in the same bundle
     that draws the build page, so the two finally look like one site. Only
     pointer.html still links site.css; it still has that chrome.

     The library's own stylesheet is not linked either. That one belongs to the
     3D viewport, which this page does not mount. -->
<!-- The page colour, before there is a page: everything in this document is
     drawn by the bundle, and until that has been fetched, parsed and rendered
     the body has no background and the browser paints it white. Two
     declarations inline rather than a stylesheet, because a `<link>` on the
     critical path would be a round trip to say what the markup says for free,
     and the CSP allows it (`style-src 'self' 'unsafe-inline'`, src/app.py).

     No ordering constraint here, unlike build.html: this page links no
     stylesheet at all, so there is nothing for this rule to come after. The
     values are `PAGE_BG` / `PAGE_FG` from ui/src/style.jsx, and
     `ui/tests/chrome.test.js` holds this copy, build.html's and the resolver's
     to them. -->
<style>html,body{background:#eceef1;color:#1c1f23}</style>
</head><body>
<!-- The whole page. The bundle looks this id up and does nothing at all when it
     is absent, which is what keeps pointer.html unaffected by it; build.html
     carries a different one (#hmr_root), and WHICH id a document has is how one
     bundle tells the two pages apart -- see ui/src/main.jsx. -->
<div id="hmr_index"></div>
<script type="module" src="/_v/hammerola.js"></script>
</body></html>
