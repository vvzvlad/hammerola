<!doctype html>
<!-- `data-theme` IS WRITTEN BY THE SERVER, from the reader's cookie, before this
     document is sent (`render.cookie_theme` / `render._template`). The attribute
     in the file is the default the hub answers with when there is no cookie, so
     the template on disk is a working light page and the dark one is the same
     document with this one word swapped.

     ON THE ROOT ELEMENT AND NOT ON THE BODY: the interface is drawn with inline
     styles, which beat any class rule, so the only thing that can repaint it is a
     `var()` resolved against an ancestor -- and the root is the one ancestor that
     exists in the first byte the browser parses. The body is also where the
     vendored viewer writes a `data-theme` of its OWN (`Display.setTheme`), so
     putting ours there would be two writers on one attribute.

     `data-proposal-panel` IS WRITTEN THE SAME WAY AND ANSWERS A DIFFERENT
     QUESTION: whether this hub serves the proposal panel at all (`PROPOSAL_PANEL`
     in .env, stamped by `render.build_page_html`). It is the HUB's answer and
     not the reader's — one value for everybody, and it cannot change while the
     page is open, so the interface reads it once and watches nothing. `off` in
     the file is what a hub that never set the variable answers, which keeps
     this template a working page WITHOUT the panel: a feature still being tried
     out does not reach anybody who did not ask for it. -->
<html lang="en" data-theme="light" data-proposal-panel="off"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>hammerola</title>
<!-- A browser handed this link stops asking for /favicon.ico, which is what
     keeps two 404s out of the log on every single page load. -->
<link rel="icon" type="image/svg+xml" href="/_v/favicon.svg">
<!-- The vendored library's own stylesheet, and the one asset on this page the
     bundle cannot carry itself: an `import` of it would make the build emit a
     second output file, which ui/vite.config.mjs exists to prevent. The viewport
     deliberately registers no shadow root so that these `.tcv_*` rules reach the
     widget at all (ui/src/viewport/element.js).

     site.css is deliberately NOT linked here any more. Everything it gave this
     page was chrome that has gone -- #bar, the settings and download panels, the
     comment form, #cad_viewer, #err -- plus one rule aimed at the library
     (.tcv_tab_material), which is moot now that the viewport starts it with
     `tools: false` and the whole panel is display:none. What is left in it is
     the RESOLVER'S chrome, including an `overflow:hidden` and a flex body that
     belong to a page holding one line of text; the front page's card grid
     scrolls, and this page lays itself out. The palette the three pages really
     do share left site.css with issue #35 and is linked below. -->
<link rel="stylesheet" href="/_v/three-cad-viewer.css">
<!-- THE PALETTE, and the page colour before there is a page. Everything below
     this line is drawn by the bundle, and until 255 KB of it has been fetched,
     parsed and rendered the document is whatever the browser makes of a body
     with no background: white. That is a flash of the wrong colour on the page
     a reader arrives at from every project card, and the longer of the two
     loads. Measured, frame by frame: transparent from the first paint until
     React rendered, and then `rgb(68,68,68)` — white, and then a flash of the
     library's dark grey.

     THAT SECOND COLOUR IS WHY THIS SITS WHERE IT SITS. three-cad-viewer.css
     carries `body { background-color: var(--tcv-bg-color) }`, and the custom
     property is defined under `[data-theme="light"]` / `[data-theme="dark"]` —
     an attribute the LIBRARY ITSELF puts on `document.body` when it first
     renders (`Display.setTheme`, reached through our `applyTheme`), and which
     the server now also stamps on the root element above. So that rule is live
     from the first paint, at the same specificity as the `html,body` rule in
     the palette below, and ours has to come SECOND or the library repaints the
     page out from under the interface. `ui/tests/chrome.test.js` checks that
     order; it is not a formatting preference.

     A LINK AND NO LONGER TWO INLINE DECLARATIONS, which is the trade issue #35
     forced and it is worth being explicit about. What used to be here was
     `html,body{background:#eceef1;color:#1c1f23}` — cheap enough to inline, and
     copied verbatim into index.html and site.css, which is three places for one
     palette to drift. A whole palette cannot be inlined three times, so it
     became a file, and the cost is one request on the critical path: a
     same-origin stylesheet of a couple of kilobytes, fetched in parallel with
     the bundle and render-blocking, so the first paint is already the right
     colour rather than a white one corrected later. -->
<link rel="stylesheet" href="/_v/tokens.css">
</head><body>
<!-- The whole page. The interface draws its own header, its own panels and its
     own error box inside this div, so the template carries no markup of its own:
     what used to sit beside it -- the header with the view and build pickers,
     the comment form, the settings panel and the container the previous page
     script rendered the widget into -- left with the script that read it.

     The bundle looks this id up and does nothing at all when it is absent, which
     is what keeps index.html and pointer.html unaffected by it. -->
<div id="hmr_root"></div>
<script type="module" src="/_v/hammerola.js"></script>
</body></html>
