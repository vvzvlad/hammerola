name: Tests

# The pull-request gate. image-check-publish.yml must never run on pull_request, because a PR
# build would push :latest and auto-update would deploy it; this workflow mirrors it up to
# the smoke gate (same suite, same Dockerfile and build flags, same ci/smoke.py; only the
# tags differ) and then stops. There is no `docker login` and no secret expression anywhere
# in this file: a pull request may come from an unreviewed branch, so this workflow must not
# be able to touch a credential. Keep the expression form out of comments too, so a grep for
# it stays empty.
on:
  # Manual re-run for a run that flaked on runner networking. Safe: this workflow touches
  # no registry and no credential.
  workflow_dispatch:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read   # checkout

# Cancelling is right here (unlike the image workflow): this workflow publishes nothing, so a
# superseded run only wastes the shared runner. Requires Gitea >= 1.26; an older instance
# ignores the block and cancels superseded PR runs on its own, which is equivalent here.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The runner is shared by every repository. The two step bounds below sum to 30 minutes
    # (20 Python + 10 JS); the job bound must exceed the sum, because act_runner kills the
    # whole job when it fires and the container cleanup steps would then never run.
    timeout-minutes: 35
    # Job-level, so the step that creates each test container and the step that removes it
    # cannot disagree about its name. One name per suite, so `docker ps` on the shared daemon
    # shows which one is still running. The run id makes the name unique; the `-pr-` infix
    # only shows which workflow started the container.
    env:
      TEST_NAME: hammerola-tests-pr-${{ github.run_id }}
      JS_NAME: hammerola-js-pr-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # No `actions/setup-python`: setup actions are not verified on this self-hosted runner,
      # and one that silently does nothing would let the gate pass having checked nothing.
      # Running the suite in a container on the same docker the build uses proves both.
      timeout-minutes: 20
      # This `run:` body is byte-identical to the one in image-check-publish.yml (see AGENTS.md).
      run: |
        set -e
        set -o pipefail
        # A re-run from the Gitea UI reuses github.run_id, so the name may still be held by a
        # killed attempt's container, and `docker run --name` fails on a conflict.
        docker rm -f -v "$TEST_NAME" || true
        # The suite's environment is a prebuilt image, ci/Dockerfile.test. Its tag is a hash of
        # its inputs (that file and the two requirements files, which are also the whole build
        # context), so on this daemon shared by every branch a stale image can never answer to
        # a current name; an unchanged input set reuses the cached layers.
        TEST_IMAGE="hammerola-test:$(cat ci/Dockerfile.test requirements.txt requirements-dev.txt | sha256sum | cut -c1-12)"
        # `--pull`: the daemon is persistent, so a cached python:3.11-slim would otherwise go
        # stale for months. The context is a tar of exactly the hashed files.
        # Memory ceiling measured pass/fail with --no-cache (a warm build runs no RUN): the
        # `pip install` is killed at 512m and builds at 768m, so 2g is 2.7-4x the floor. The
        # two flags must stay equal: `--memory-swap` is the memory+swap total, and unset it
        # adds swap equal to the limit instead of killing the build there.
        tar -cf - ci/Dockerfile.test requirements.txt requirements-dev.txt \
          | docker build --pull --memory=2g --memory-swap=2g \
          -f ci/Dockerfile.test -t "$TEST_IMAGE" -
        # The workspace is streamed in as a tar over stdin, not bind-mounted: this job runs
        # inside act_runner's job container while `docker` talks to the host's daemon, so a
        # `-v "$PWD:/src"` would name a different path on the host. It also keeps the
        # container from writing caches back into the checkout as root. .dockerignore does
        # not apply to a tar, so every exclusion is spelled out:
        # - `.git` travels, because tests/test_no_conflict_markers.py asks git for the list
        #   of tracked files; `.git/config` stays behind because actions/checkout writes the
        #   run's token into it (nothing in the check reads it).
        # - `.venv`, `ui/node_modules`, `viewer/node_modules`, `viewer/dist`, `__pycache__`
        #   and `.pytest_cache` are host-built artefacts the container cannot use; they only
        #   exist in a developer's checkout, where this same command reproduces a CI failure.
        # - `data/` and `.env` hold a workstation's real state and credentials;
        #   src/settings.py reads `.env` from beside the code, so it must not travel.
        # EDIT_TOKEN is the one setting with no default, and `settings` is built at import
        # time; any non-empty string works, as it is only compared for equality.
        # `--name` is what lets the cleanup step reach the container: a step killed by its
        # timeout kills the docker CLI on the runner, not the container on the host, so
        # `--rm` never fires.
        # Memory ceiling, measured pass/fail at a limit and never by `memory.peak` (which
        # counts page cache and rises with the limit): the suite passes at 3g and 6g, and at
        # 2g the kernel kills a worker and the run hangs until the step timeout. 6g is 2-3x
        # the floor. The flags must stay equal, as above. Re-measure when the image contents
        # or the worker count change; the peak is tests/test_archive_security.py holding
        # 800 MB in one buffer while other workers hold ~222 MB of OCCT each.
        # What is in the image and why is documented in ci/Dockerfile.test.
        # `-n 4 --dist loadfile`: the suite mostly waits on sockets, subprocesses and builds,
        # so workers cut the wall clock (163 s against 293 s serial). Four, not `auto`, because
        # the memory ceiling is measured at four. `loadfile` keeps a module's tests on one
        # worker, so module-scoped fixtures such as the real CAD build in
        # tests/test_readme_example.py run once. Kept out of pytest.ini so `make test` stays
        # serial and debuggable.
        # Two invocations: tests/buildproc/conftest.py asserts the real kernel is NOT
        # imported in the pytest process, and under xdist a worker could otherwise run a
        # buildproc file after a file that imports cadquery. This also relies on nothing
        # under src/ importing the kernel at module level and no test under tests/buildproc/
        # importing it (probes.py uses a subprocess).
        tar -cf - --exclude=./.git/config --exclude=./.venv --exclude=./ui/node_modules \
          --exclude=./viewer/node_modules --exclude=./viewer/dist \
          --exclude=./data --exclude=./.env --exclude=./.pytest_cache \
          --exclude=__pycache__ . \
          | docker run --rm -i --name "$TEST_NAME" \
          --memory=6g --memory-swap=6g \
          -e EDIT_TOKEN=fake-test-edit-token-not-real \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$TEST_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pytest -n 4 --dist loadfile tests/buildproc --tb=short -q; pytest -n 4 --dist loadfile --ignore=tests/buildproc --tb=short -q'

    - name: Run the JS test suite in a container
      # vitest over ui/tests in jsdom: the GPU-free parts of the <hmr-viewport> adapter.
      # On a pull request this is the only place the browser code is executed: the image
      # built below carries the bundle, not the suite.
      timeout-minutes: 10
      env:
        # The same base the Dockerfile's `ui` stage builds the bundle with.
        NODE_IMAGE: node:22-bookworm-slim
      # This `run:` body is byte-identical to the one in image-check-publish.yml (see AGENTS.md).
      run: |
        set -e
        set -o pipefail
        # A container, because node is not installed on this runner and is not part of the
        # project's toolchain. node:22-bookworm-slim matches the Dockerfile's `ui` stage:
        # change one, change both.
        # A re-run reuses github.run_id, so clear a name a killed attempt may still hold.
        docker rm -f -v "$JS_NAME" || true
        # A positive list of paths: almost everything vitest reads is under ui/, and every
        # path from outside it is named here. ui/tests/chrome.test.js reads templates/,
        # brand/ and the static/_v CSS, SVG and pointer scripts as files and names every one
        # of them, so dropping one fails that test; keep the two lists in step.
        # three-cad-viewer.esm.js is for ui/tests/hatch.test.js (the three.js shader chunk the
        # section hatch splices at); three.module.js and three.core.js are three's own source,
        # which the viewer bundle keeps external, read by the hatch, picking and outline tests.
        # BufferGeometryUtils.js, GLTFLoader.js and SkeletonUtils.js (which GLTFLoader imports)
        # are three's addons, read by ui/tests/board3d.test.js and ui/tests/board3dview.test.js.
        # Not all of static/_v: it also holds this project's own built bundle.
        # ecad-viewer/packages is the KiCad viewer's source, which ui/tests/schematicpins.test.js
        # reads through the viewer's own parser (aliased in ui/vitest.config.mjs); its build
        # output is excluded.
        # Add paths deliberately rather than switching to `.` plus exclusions: nothing
        # travels that is not named, so `.env`, `data/` and `.git/config` cannot leak in a
        # by-hand reproduction. A missing path fails only here, not on a workstation.
        # `ui/node_modules` (host binaries, reinstalled by `npm ci`) and `ui/dist` (vite's
        # output) are excluded.
        # Streamed as a tar over stdin for the same reason as the Python step.
        # `npm ci` installs the lockfile exactly and fails when package.json disagrees.
        # CI=true selects non-interactive defaults; the NPM_CONFIG_* variables silence the
        # update notifier and funding banner. `--pull always` because the daemon is
        # persistent. `--name` lets the cleanup step reach a container whose step timed out.
        # Memory ceiling measured pass/fail: killed at 768m, passes at 1g, so 3g is 3-4x the
        # floor. Vitest's jsdom worker pool grows with the CPU count (8 here), which the
        # margin absorbs. The two flags must stay equal.
        tar -cf - --exclude=./ui/node_modules --exclude=./ui/dist \
          --exclude=./ecad-viewer/packages/ecad-viewer-app/build \
          ./ui ./templates ./brand ./ecad-viewer/packages \
          ./static/_v/tokens.css ./static/_v/site.css ./static/_v/favicon.svg \
          ./static/_v/pointer.js ./static/_v/pointer_pref.js ./static/_v/three-cad-viewer.esm.js \
          ./static/_v/three.module.js ./static/_v/three.core.js \
          ./static/_v/BufferGeometryUtils.js ./static/_v/GLTFLoader.js ./static/_v/SkeletonUtils.js \
          | docker run --rm -i --pull always --name "$JS_NAME" \
          --memory=3g --memory-swap=3g \
          -e CI=true \
          -e NPM_CONFIG_UPDATE_NOTIFIER=false \
          -e NPM_CONFIG_FUND=false \
          "$NODE_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src/ui; npm ci; npm test'

    - name: Remove the test container from the runner
      # For the run where the suite step hit its timeout: the docker CLI died on the runner
      # while the container kept running on the shared daemon, so `--rm` never fired. On a
      # green run this does nothing. `|| true` so a cleanup error never hides the suite's
      # verdict. `-v` removes only that container's anonymous volumes (none today), never a
      # named one; the pre-run `docker rm -f -v` in the step body is the other removal path.
      if: always()
      run: |
        docker rm -f -v "$TEST_NAME" || true

    - name: Remove the JS test container from the runner
      # The twin of the step above, for the JS suite's container.
      if: always()
      run: |
        docker rm -f -v "$JS_NAME" || true

  build:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    # The step bounds sum to 35 minutes (20 build + 15 smoke); the job bound must exceed the
    # sum, because act_runner kills the whole job when it fires and the `if: always()`
    # cleanup steps are then not guaranteed to run.
    timeout-minutes: 40
    # Job-level, so no two steps can disagree about them: SMOKE_NAME is the base name of the
    # three containers ci/smoke.py starts and the cleanup removes; SMOKE_IMAGE is the tag the
    # build writes and the gate grades. The tag is local and never pushed.
    env:
      SMOKE_NAME: hammerola-smoke-pr-${{ github.run_id }}
      SMOKE_IMAGE: hammerola-ci:${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by act_runner; the
      # job-level one above is only the outer bound. 20 minutes is well above a realistic cold
      # build of python:3.11-slim plus apt and the pinned wheels.
      # Deliberately NOT byte-identical to the build step in image-check-publish.yml: this one
      # builds one local tag, and copying the tag computation here would put a registry path
      # in a workflow a pull request can trigger.
      timeout-minutes: 20
      run: |
        # --pull is required here: unlike GitHub's ephemeral runners, the self-hosted
        # runner has a persistent docker daemon, so a once-pulled base image
        # would sit in its cache for months and every build would inherit an
        # unpatched base layer.
        # Memory ceiling: BuildKit applies it per RUN. Measured pass/fail with --no-cache:
        # `pip install --require-hashes -r requirements.lock` (the OCCT wheels) is killed at
        # 512m and passes at 768m, so 2g is 2.7-4x the floor. The two flags must stay equal:
        # unset, `--memory-swap` adds swap equal to the limit instead of killing the build.
        docker build --pull --memory=2g --memory-swap=2g . --file Dockerfile --tag "$SMOKE_IMAGE"

    - name: Smoke-test the built image
      # The same gate the publishing workflow runs, after the image exists; here nothing
      # follows it, so a pull request gets the same verdict on the same artefact without any
      # way to publish it.
      # ci/smoke.py runs on the runner and drives `docker` itself. No port is published:
      # this job runs inside act_runner's container, so anything inside the image is read
      # with `docker exec`.
      # The gate holds no credential and reaches no external service, which is what makes
      # it runnable on pull requests at all.
      # The timeout is set against ci/smoke.py's own worst case, which the script documents and
      # sums from its individual per-call bounds: 840 s, if every docker call runs out its
      # budget (in practice a few seconds). If the timeout kills the script, its own cleanup
      # does not run and the `if: always()` step below catches that. Raise this number
      # whenever that sum grows past it, in BOTH workflows.
      # SMOKE_IMAGE and SMOKE_NAME come from the job-level env.
      timeout-minutes: 15
      # This `run:` body is byte-identical to the one in image-check-publish.yml (see AGENTS.md).
      run: |
        python3 ci/smoke.py

    - name: Remove the smoke containers from the runner
      # `always()`, and before the image cleanup: a leftover container on the shared daemon
      # would stay forever and pin the image, failing the `docker rmi` below. ci/smoke.py
      # removes its containers itself, so normally this is a no-op; it is for the run where
      # the smoke step was killed by its timeout, which kills the docker client but not the
      # container.
      if: always()
      run: |
        # "" is the long-lived container the privilege and packaging checks exec into;
        # -guard runs the missing-environment check; -cmd runs the image's real command and
        # has no `--rm`, because its logs and exit code are read after it exits. Kept in step
        # with GUARD_SUFFIX and CMD_SUFFIX in ci/smoke.py.
        # No `set -eu`: this is best-effort cleanup and must not turn a leftover into a red job.
        # `-v` removes only these containers' anonymous volumes, never a named one. Both
        # removal paths carry it: this step and `remove_container()` in ci/smoke.py.
        for suffix in "" -guard -cmd; do docker rm -f -v "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built image from the runner
      # The runner's daemon is persistent, so PR builds would otherwise fill the disk. This
      # removes only the one tag this run created; no `docker system prune`, which would also
      # wipe other repositories' images. The BuildKit cache and dangling base images left by
      # `--pull` need a separate periodic cleanup on the runner host.
      if: always()
      run: |
        docker rmi "$SMOKE_IMAGE" || true
