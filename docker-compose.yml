# EXAMPLE compose — an illustration of how this service is configured, NOT a copy of what runs.
# It shows which variables, volumes, ports and labels the service needs; copy it as a starting
# point. The real deployment (a Portainer stack) is the only source of truth; a difference
# between the two is not a defect. Do not edit this file against a deployment or vice versa.
#
# NOTHING REAL GOES IN HERE, comments included: `XXX` for a secret, `example.com`/`example.lc`
# for a name, RFC 5737 addresses for an IP. Some of these repositories are public.
# Exceptions: the registry host (real, or there is nothing to pull), and the target host's own
# infrastructure names, the external network `docker_main_net` and the certresolver
# `letsEncrypt`. Check those against the host in the copy you deploy: a network that exists
# but has no Traefik attached gives a healthy container behind a 502, and an unknown resolver
# gives Traefik's self-signed certificate.
#
# Deploy from a prebuilt image — never build on the host that serves it.

# This is the WEB-SERVICE variant (published via Traefik). For a polling bot with
# no inbound port, drop `networks`, the Traefik labels and the healthcheck.

# The key below is NOT the volume's name on the host: compose names it `<project>_<key>`,
# and under Portainer the project is the stack name. Deployed as a stack named `hammerola`,
# this key resolves to `hammerola_hammerola`. Settle the single project name before the first
# deploy: renaming the stack later detaches it from its data.
# Adopting an existing deployment, or recreating a stack under a different name, silently
# mounts a new empty volume. Run `docker volume ls` on the target host before the first
# redeploy, or pin the name, which turns a mismatch into a loud refusal to start:
#
#   volumes:
#     hammerola:
#       external: true
#       name: the_exact_volume_name_on_the_host
volumes:
  hammerola:

networks:
  docker_main_net:
    external: true

services:
  hammerola:
    image: gitea.vvzvlad.xyz/projects/hammerola:latest
    container_name: hammerola
    restart: always
    # The app runs as non-root user `app` (uid 1000): the entrypoint starts as
    # root, chowns /app/data and drops privileges via gosu. Setting a
    # `user: "UID:GID"` override here makes the entrypoint skip the chown —
    # the volume must then already be owned by that uid.
    security_opt:
      - no-new-privileges:true   # forbids privilege escalation via setuid binaries; compatible with gosu (it only drops privileges)
    # Optional hardening. The cap_add list is the minimum the root entrypoint
    # needs (chown -R the volume + gosu setuid/setgid drop):
    # cap_drop: [ALL]
    # cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    volumes:
      - hammerola:/app/data          # all mutable state survives restart/update
    # Configuration belongs in this block or in a file that travels with the stack, never in
    # an `env_file:` with an absolute host path: Portainer runs compose inside its own
    # container, so that path resolves in the Portainer server's filesystem, not on the host.
    environment:
      # The only secret, one for the whole system. Replace XXX before deploying. It is the
      # `Authorization: Bearer` value on every route that changes something or reads something
      # private (publishing, a build's sources and log, renaming or removing a project, the
      # comment queue). The public pages have no read-side auth. The same value goes to
      # whatever publishes here: a model repository's CI secret and `hammerola login`.
      EDIT_TOKEN: XXX
      # Everything below has a default in src/settings.py and is spelled out here
      # only where a different value is wanted. DATA_DIR must match the mount
      # point of the volume declared above.
      DATA_DIR: /app/data
      # No retention variable exists: a published build is never deleted, so the volume grows
      # until cleared by hand.
      # MAX_BUILD_BYTES: 67108864 # 64 MiB ceiling on one uploaded build
      # The size ceilings on the comment endpoint; defaults are in src/settings.py. There is no
      # count ceiling or rate limit: writing a comment takes EDIT_TOKEN.
      # COMMENT_MAX_TEXT_CHARS: 4000
      # COMMENT_MAX_PHOTO_BYTES: 8388608   # 8 MiB per photo or rendered frame
      # COMMENT_MAX_BODY_BYTES: 20971520   # 20 MiB for the whole form
      TZ: Europe/Moscow
    networks:
      - docker_main_net
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      traefik.enable: "true"
      # Placeholder host; the real domain is set in the deployment's own stack.
      traefik.http.routers.hammerola.rule: Host(`hammerola.example.com`)
      traefik.http.services.hammerola.loadBalancer.server.port: 8000
      traefik.http.routers.hammerola.entrypoints: websecure
      traefik.http.routers.hammerola.tls: "true"
      traefik.http.routers.hammerola.tls.certresolver: letsEncrypt
      # Compression is required: a view is a JSON tessellation (2.02 MB raw, 0.31 MB gzip on a
      # real model) fetched on every view switch. The application compresses nothing itself, so
      # the file server stays a plain sendfile with an honest Content-Length.
      traefik.http.middlewares.hammerola_compress.compress: "true"
      traefik.http.routers.hammerola.middlewares: hammerola_compress
      # Auto-update: ContainerAutomation.AutoUpdate in our Portainer build (the fork in
      # `projects/portainer` on gitea.vvzvlad.xyz; stock Portainer has no such mechanism)
      # redeploys the container when :latest moves, with a health-gated rollback (see
      # `healthcheck:`). The poll interval is a Portainer setting. The label is inert on a host
      # whose control plane lacks ContainerAutomation: check which Portainer owns the target
      # host at deploy time. This is the only update label; do not add watchtower-style keys.
      # `io.portainer.autoheal.enable` is deliberately absent: auto-heal restarts `unhealthy`
      # containers, and a restart that lands before the rollback gate reacts resets health to
      # `starting`, so a bad update can end up accepted. Add it only where staying up matters
      # more than an honest rollback.
      io.portainer.update.enable: "true"
    healthcheck:
      # Short interval + start_period are REQUIRED behind Traefik: Traefik does not
      # route to a container while its health is starting/unhealthy, so interval:30m
      # with no start_period leaves it unrouted for ~30 min (default cert + 404).
      # They also drive the auto-update rollback gate: after recreating a container, our
      # Portainer build polls health every 3 s and rolls the image back if the container is
      # still `starting`, `unhealthy` or not running at the deadline,
      # max(RollbackTimeout, start_period + 15s) (RollbackTimeout is 120 s on our instance).
      # Docker's first probe comes one `interval` after start unless a start_period is set, so
      # a long interval without one rolls back a good image; the updater then suppresses that
      # container for 24 h.
      # Without any healthcheck the gate is skipped and nothing is ever rolled back. Rollback
      # also needs a `container_name` and a tag (not a digest-pinned image).
      test: ["CMD", "curl", "-s", "-f", "-o", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
